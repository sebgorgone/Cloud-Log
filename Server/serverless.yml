service: cloud-log-api

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  timeout: 20
  environment:
  vpc:
    securityGroupIds:
      - sg-0b18501d058f04fb3 
    subnetIds:
      - subnet-057acc8c585ba8059

functions:
  api:
    handler: server.handler
    events:
      - http:
          path: /{proxy+}
          method: any
          cors: 
            origin: 'https://main.d28k95mqep4uke.amplifyapp.com'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Accept
            allowCredentials: true