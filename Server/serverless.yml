service: cloud-log-api

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  timeout: 20
  environment:
    DB_HOST: '{{resolve:secretsmanager:CLDB:SecretString:DB_HOST}}'
    DB_USER: '{{resolve:secretsmanager:CLDB:SecretString:DB_USER}}'
    DB_PASSWORD: '{{resolve:secretsmanager:CLDB:SecretString:DB_PASSWORD}}'
    DB_NAME: '{{resolve:secretsmanager:CLDB:SecretString:DB_NAME}}'
    JWT_SECRET: '{{resolve:secretsmanager:CLDB:SecretString:JWT_SECRET}}'
    PORT: '{{resolve:secretsmanager:CLDB:SecretString:PORT}}'
    CORS_ORIGINS: '{{resolve:secretsmanager:CLDB:SecretString:CORS_ORIGINS}}'

functions:
  api:
    handler: server.handler
    events:
      - http:
          path: /{proxy+}
          method: any
          cors: 
            origin: 'https://main.d28k95mqep4uke.amplifyapp.com'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Accept
            allowCredentials: true